[pytest]
# `pytest` with no path used to walk the whole repo, which includes
# `data/projects/` - every OTHER project's workspace, with its own code and its
# own conftest files - and died with a dozen collection errors before running a
# single test of this app's. Naming the directory here means a bare `pytest` is
# now the portal's own suite, which is what anybody typing it meant.
testpaths = tests

# Run across cores. This suite is 4,500 tests and takes ~166s on one; on eight
# it is ~42s, with the same tests and the same assertions. That matters here
# more than in most repos because the tests are run by *agents*, several times
# a build run - the files a change owns, once per mutation in a sweep, then the
# whole suite before committing. Measured off a real run's transcript on
# 2026-08-29: waiting on Bash was 41% of a 61-minute run, and six of those
# calls - test-suite runs - were 21 of the 25 minutes. This is the one way to
# buy that back that costs nothing at all: no test dropped, no model changed.
#
# Eight rather than `auto`: a run lives in a 7.5 GiB systemd scope and each
# worker loads the whole app. Eight peak at ~1.8 GB together, which leaves the
# agent its room; `auto` would take all 16 cores of this box to save another
# ~2s, and a test tree that trips the scope's cap dies as a bare `Killed`,
# which reads as a broken suite rather than as memory.
#
# Two things to know when reading a failure. Output interleaves and the run
# order is no longer the file order, so when that matters - bisecting an
# order-dependent test, reading a traceback in sequence - pass `-n0`, which
# overrides this. And a test that passes serially but fails under `-n0`-less
# parallelism is usually not a flake: it is leaked module-global state, which
# is a real defect that serial running was hiding. That is exactly how
# `test_the_tick_holds_new_runs_and_fires_once_quiet` was found.
addopts = -n 8
